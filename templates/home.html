<!DOCTYPE html>
<html>
<head>
    <title>Credit Card Fraud Detection</title>
    <style>

        body{
            font-family: Arial;
            background:#f4f6f8;
            text-align:center;
        }

        .container{
            margin-top:50px;
            background:white;
            width:400px;
            padding:30px;
            margin-left:auto;
            margin-right:auto;
            border-radius:10px;
            box-shadow:0px 0px 10px rgba(0,0,0,0.1);
        }

        input{
            width:90%;
            padding:10px;
            margin:8px;
        }

        button{
            padding:10px 20px;
            background:#007BFF;
            color:white;
            border:none;
            border-radius:5px;
            cursor:pointer;
        }

        button:hover{
            background:#0056b3;
        }

    </style>
</head>

<body>

<div class="container">

<h2>Credit Card Fraud Detection</h2>

<form action="/predict" method="post">

<input type="number" step="any" name="amount" placeholder="Transaction Amount" required>

<input type="number" step="any" name="merchant_id" placeholder="Merchant ID" required>

<input type="number" name="transaction_hour" placeholder="Transaction Hour (0-23)" required>

<input type="number" name="transaction_day" placeholder="Transaction Day (1-31)" required>

<input type="number" name="transaction_month" placeholder="Transaction Month (1-12)" required>

<br>

<button type="submit">Predict</button>

</form>

<h3>{{ prediction_text }}</h3>

</div>

</body>
</html>
